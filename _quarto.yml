book:
  title: Programación para la investigación
  subtitle: Python, R, ETL, API, paquetes y servidores MCP para trabajar con datos científicos
  author:
  - name: Pablo Sánchez-Núñez
    orcid: 0000-0001-7845-9506
    url: https://pablosancheznunez.com
    affiliation: Universidad Carlos III de Madrid
  date: last-modified
  date-format: D [de] MMMM [de] YYYY
  language: es
  site-url: https://pablosancheznunez.com/programacion-investigacion/
  doi: 10.5281/zenodo.24534442
  search: true
  page-navigation: true
  sidebar:
    tools:
    - icon: download
      menu:
      - text: Libro en PDF
        href: pdf/programacion-investigacion.pdf
      - text: Libro en EPUB (lectores de libros electrónicos)
        href: pdf/programacion-investigacion.epub
  page-footer:
    left: © 2026 [Pablo Sánchez-Núñez](https://pablosancheznunez.com) · [ORCID 0000-0001-7845-9506](https://orcid.org/0000-0001-7845-9506) · Texto bajo licencia [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.es)
    right: Universidad Carlos III de Madrid · Hecho con [Quarto](https://quarto.org), [webR](https://docs.r-wasm.org/webr/latest/) y [Pyodide](https://pyodide.org)
  chapters:
  - index.qmd
  - 00-r-en-el-libro.qmd
  - part: Capítulos
    chapters:
    - 01-flujo.qmd
    - 02-python.qmd
    - 03-etl.qmd
    - 04-api.qmd
    - 05-paquetes.qmd
    - 06-mcp.qmd
  appendices:
  - 90-chuleta.qmd
  - 91-guia-docente.qmd
  - 92-glosario.qmd
lang: es
crossref:
  chapters: false
filters:
- webex
- interactivos
format:
  live-html:
    theme:
      light:
      - cosmo
      - estilos.scss
      dark:
      - darkly
      - estilos-oscuro.scss
    respect-user-color-scheme: true
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    css: fuentes/fuentes.css
    lightbox: auto
    link-external-newwindow: true
    callout-appearance: simple
    include-in-header:
    - laboratorio.html
    include-after-body:
    - accesibilidad.html
    - progreso.html
webr:
  engine-url: webr/
  repos:
  - webr-repo
  resources:
  - datos
  packages:
  - jsonlite
pyodide:
  engine-url: pyodide/
  resources:
  - datos
